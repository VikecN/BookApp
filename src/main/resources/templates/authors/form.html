<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add Author</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f3ef;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 1.75rem 2rem 1.5rem;
            border-bottom: 1px solid #e8e4df;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #EEEDFE;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .card-header h1 {
            font-family: 'Lora', serif;
            font-size: 21px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 3px;
        }

        .card-header p { font-size: 13px; color: #888; }

        .card-body { padding: 1.75rem 2rem; }

        .field { margin-bottom: 1.2rem; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #888;
            margin-bottom: 6px;
        }

        .field input,
        .field textarea {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            background: #faf9f7;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: #3C3489;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(60, 52, 137, 0.08);
        }

        .field textarea {
            resize: vertical;
            min-height: 120px;
            line-height: 1.6;
        }

        .field-error {
            font-size: 12px;
            color: #c0392b;
            margin-top: 4px;
        }

        .char-count {
            font-size: 11px;
            color: #bbb;
            text-align: right;
            margin-top: 4px;
        }

        .card-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding: 1.2rem 2rem;
            border-top: 1px solid #e8e4df;
            background: #faf9f7;
        }

        .btn-cancel {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: #666;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 9px 18px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-save {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #3C3489;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            cursor: pointer;
        }

        .btn-save:hover { opacity: 0.88; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <div class="header-avatar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#3C3489" stroke-width="1.5">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
        <div>
            <h1>Add an author</h1>
            <p>Enter the author's details below</p>
        </div>
    </div>

    <form id="authorForm" th:action="@{/authors}" th:object="${author}" method="post">
        <div class="card-body">

            <div class="field">
                <label for="name">Name</label>
                <input type="text" id="name" th:field="*{name}" placeholder="e.g. Robert C. Martin"/>
                <span class="field-error" th:if="${#fields.hasErrors('name')}"
                      th:errors="*{name}"></span>
            </div>

            <div class="field">
                <label for="biography">Biography</label>
                <textarea id="biography" th:field="*{biography}"
                          maxlength="500"
                          placeholder="A short biography of the author…"
                          oninput="document.getElementById('charCount').textContent = this.value.length + ' / 500'">
                </textarea>
                <div class="char-count"><span id="charCount">0 / 500</span></div>
                <span class="field-error" th:if="${#fields.hasErrors('biography')}"
                      th:errors="*{biography}"></span>
            </div>

        </div>
    </form>

    <div class="card-actions">
        <a th:href="@{/authors}" class="btn-cancel">Cancel</a>
        <button type="submit" form="authorForm" class="btn-save">Save author</button>
    </div>
</div>

<script>
    const bioField = document.getElementById('biography');
    if (bioField.value) {
        document.getElementById('charCount').textContent = bioField.value.length + ' / 500';
    }
</script>

</body>
</html>
