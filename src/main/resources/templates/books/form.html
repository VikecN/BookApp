<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>Add Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@600&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet"/>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: #f5f3ef;
            min-height: 100vh;
            padding: 2rem 1rem;
        }

        .card {
            max-width: 520px;
            margin: 0 auto;
            background: #fff;
            border: 1px solid #e8e4df;
            border-radius: 12px;
            overflow: hidden;
        }

        .card-header {
            padding: 1.75rem 2rem 1.5rem;
            border-bottom: 1px solid #e8e4df;
        }

        .card-header h1 {
            font-family: 'Lora', serif;
            font-size: 21px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 3px;
        }

        .card-header p { font-size: 13px; color: #888; }

        .card-body { padding: 1.75rem 2rem; }

        .field { margin-bottom: 1.2rem; }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: #888;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: #1a1a1a;
            background: #faf9f7;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 9px 12px;
            outline: none;
            transition: border-color 0.15s, box-shadow 0.15s;
        }

        .field input:focus,
        .field select:focus {
            border-color: #3C3489;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(60, 52, 137, 0.08);
        }

        .field-error {
            font-size: 12px;
            color: #c0392b;
            margin-top: 4px;
        }

        /* Cover upload */
        .cover-zone { display: flex; gap: 1rem; align-items: flex-start; }

        .cover-thumb {
            width: 72px;
            height: 98px;
            flex-shrink: 0;
            border: 1px solid #e8e4df;
            border-radius: 8px;
            background: #faf9f7;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .cover-thumb img { width: 100%; height: 100%; object-fit: cover; display: none; }

        .cover-placeholder { text-align: center; }
        .cover-placeholder svg { opacity: 0.25; }
        .cover-placeholder span { display: block; font-size: 10px; color: #bbb; margin-top: 4px; }

        .file-label {
            display: inline-block;
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            color: #555;
            background: #faf9f7;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 8px 14px;
            cursor: pointer;
        }

        .file-label:hover { background: #f0ede8; }
        .file-hint { font-size: 11px; color: #bbb; margin-top: 6px; }

        /* Actions */
        .card-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            padding: 1.2rem 2rem;
            border-top: 1px solid #e8e4df;
            background: #faf9f7;
        }

        .btn-cancel {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            color: #666;
            background: transparent;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 9px 18px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-save {
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 500;
            color: #fff;
            background: #3C3489;
            border: none;
            border-radius: 8px;
            padding: 9px 22px;
            cursor: pointer;
        }

        .btn-save:hover { opacity: 0.88; }
    </style>
</head>
<body>

<div class="card">
    <div class="card-header">
        <h1>Add a new book</h1>
        <p>Fill in the details to add a book to the library</p>
    </div>

    <form id="bookForm" th:action="@{/books}" th:object="${book}"
          method="post" enctype="multipart/form-data">
        <div class="card-body">

            <div class="field">
                <label for="title">Title</label>
                <input type="text" id="title" th:field="*{title}" placeholder="e.g. Clean Code"/>
                <span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>

            <div class="field">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" th:field="*{isbn}" placeholder="978-0-00-000000-0"/>
                <span class="field-error" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span>
            </div>

            <div class="field">
                <label for="authorId">Author</label>
                <select id="authorId" th:field="*{authorId}">
                    <option value="">Select an author</option>
                    <option th:each="author : ${authors}"
                            th:value="${author.id}"
                            th:text="${author.name}">
                    </option>
                </select>
                <span class="field-error" th:if="${#fields.hasErrors('authorId')}" th:errors="*{authorId}"></span>
            </div>

            <div class="field">
                <label>Cover image</label>
                <div class="cover-zone">
                    <div class="cover-thumb">
                        <img id="previewImg" src="" alt="Cover preview"/>
                        <div class="cover-placeholder" id="coverPlaceholder">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
                                 stroke="currentColor" stroke-width="1.5">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                                <path d="M3 9h18M9 21V9"/>
                            </svg>
                            <span>No image</span>
                        </div>
                    </div>
                    <div>
                        <label class="file-label" for="image">Choose file</label>
                        <input type="file" id="image" name="image"
                               accept="image/*" style="display: none;"
                               onchange="previewCover(this)"/>
                        <p class="file-hint">JPG or PNG · Max 5 MB</p>
                    </div>
                </div>
            </div>

        </div>
    </form>

    <div class="card-actions">
        <a th:href="@{/books}" class="btn-cancel">Cancel</a>
        <button type="submit" form="bookForm" class="btn-save">Save book</button>
    </div>
</div>

<script>
    function previewCover(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = e => {
            const img = document.getElementById('previewImg');
            img.src = e.target.result;
            img.style.display = 'block';
            document.getElementById('coverPlaceholder').style.display = 'none';
        };
        reader.readAsDataURL(file);
    }
</script>
</body>
</html>
