<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Books</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"/>
</head>
<body>
<div class="container mt-4">
    <h2>Books</h2>
    <a th:href="@{/books/new}" class="btn btn-primary mb-3">Add Book</a>

    <table class="table">
        <thead>
        <tr>
            <th>Cover</th>
            <th>Title</th>
            <th>Author</th>
            <th>ISBN</th>
            <th>Actions</th>
        </tr>
        </thead>
        <tbody>
        <!-- th:each loops over the "books" list from the model -->
        <tr th:each="book : ${books}">
            <td>
                <img th:src="@{/api/books/{id}/cover(id=${book.id})}"
                     width="50" alt="cover"/>
            </td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author.name}"></td>
            <td th:text="${book.isbn}"></td>
            <td>
                <a th:href="@{/books/{id}(id=${book.id})}" class="btn btn-sm btn-info">View</a>
                <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-warning">Edit</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
